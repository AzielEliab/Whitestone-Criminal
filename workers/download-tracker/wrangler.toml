name = "whitestone-criminal-download-tracker"
main = "src/index.js"
compatibility_date = "2026-09-18"
workers_dev = true

# Isolated counter. Binding name MUST stay DOWNLOADS.
# The namespace title for the teammate's deploy is WHITESTONE_CRIMINAL_DOWNLOADS.
# Create it once, then uncomment and paste the id. Do not invent an id here.
#   npx wrangler kv namespace create DOWNLOADS
# [[kv_namespaces]]
# binding = "DOWNLOADS"
# id = ""

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/", "/download", "/download/", "/install.sh", "/stats", "/count", "/event", "/cite.json", "/openapi.json", "/robots.txt", "/sitemap.xml", "/llms.txt", "/app", "/app/", "/app/*", "/preview.png", "/favicon.svg"]

[observability]
enabled = true
